name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Packaging changes are rehearsed on pull requests and on demand, without publishing.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - cliff.toml
      - scripts/release*.sh
      - src-gpui/build.rs
      - src-gpui/packaging/**
      - src-gpui/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Version, notes and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the version shared by the tag and the manifests
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-gpui/Cargo.toml | head -n 1)
          engine=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$engine" != "$version" ]; then
            echo "::error::Cargo.toml ($engine) et src-gpui/Cargo.toml ($version) n’ont pas la même version."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version des manifests."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Le tag $GITHUB_REF_NAME ne pointe pas sur un commit de main."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/release-notes.sh "$VERSION"
      - run: rustup show
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - name: Collect Mangrove's license and the third-party licenses
        run: |
          mkdir notices
          cp LICENSE.md notices/
          sh src-gpui/scripts/third-party-licenses.sh notices/THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: notices/
          if-no-files-found: error

  build:
    name: Build / ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            asset: macos-arm64.dmg
          # Cross-compiled on the Apple Silicon runner.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            asset: macos-x86_64.dmg
          # The oldest supported Ubuntu keeps the glibc requirement at 2.35.
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ASSET: mangrove-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config cmake libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev desktop-file-utils
      - run: rustup show
      - run: rustup target add "$TARGET"
      # Published builds start from a clean target directory.
      - if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-gpui -> target
          key: release-${{ matrix.target }}
      - name: Package the macOS application
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app=$(sh src-gpui/scripts/package-macos.sh --target "$TARGET")
          codesign --verify --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/mangrove-gpui")" = "$ARCH"
          stage=$(mktemp -d)
          cp -R "$app" notices/* "$stage/"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          # hdiutil occasionally reports a busy resource on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname Mangrove -srcfolder "$stage" -format UDZO -ov "dist/$ASSET" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          hdiutil verify "dist/$ASSET"
      - name: Package the Linux application
        if: runner.os == 'Linux'
        run: |
          prefix=$(sh src-gpui/scripts/package-linux.sh)
          mkdir -p "$prefix/share/doc/mangrove" dist
          cp notices/* "$prefix/share/doc/mangrove/"
          tar --owner=0 --group=0 -czf "dist/$ASSET" -C "$(dirname "$prefix")" mangrove
      - name: Package the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # A static C runtime spares users the Visual C++ redistributable.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --manifest-path src-gpui/Cargo.toml --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw 'La compilation de Mangrove a échoué.' }
          $exe = "src-gpui/target/$env:TARGET/release/mangrove-gpui.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          # Subsystem 2 is a GUI application, launched without a console window.
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $pe + 0x5C) -ne 2) { throw 'Mangrove.exe ouvrirait une console.' }
          if ([Text.Encoding]::ASCII.GetString($bytes) -match 'VCRUNTIME140') { throw 'Mangrove.exe dépend encore du runtime Visual C++.' }
          $stage = Join-Path $env:RUNNER_TEMP 'Mangrove'
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item $exe (Join-Path $stage 'Mangrove.exe')
          Copy-Item notices/* $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$env:ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish the GitHub release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: mangrove-*
          merge-multiple: true
      - name: Create the release with its notes, builds and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          sh scripts/release-notes.sh "$VERSION" > "$notes"
          cat >> "$notes" <<NOTES

          ---

          Installation : voir [docs/releases.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/v$VERSION/docs/releases.md#installer-une-release). Sommes SHA-256 : \`SHA256SUMS.txt\`.
          NOTES
          (cd dist && sha256sum mangrove-* > SHA256SUMS.txt)
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mangrove $VERSION" --notes-file "$notes"
