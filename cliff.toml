# CHANGELOG.md generation from Conventional Commits, run by scripts/release.sh.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
Évolutions notables de Mangrove, regroupées par version. Chaque section est générée depuis les commits par `scripts/release.sh`, relue avant le tag, puis reprise telle quelle dans la release GitHub.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Dpblandin/mangrove/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Incompatible** : {% endif %}\
            {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
# Trims each template line, so the indentation above stays out of the output.
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '#([0-9]+)', replace = "[#${1}](https://github.com/Dpblandin/mangrove/issues/${1})" },
]
# Only user-visible changes; refactors, docs, tests, CI and merges stay in Git history.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Nouveautés" },
  { message = "^fix", group = "<!-- 1 -->Corrections" },
  { message = "^perf", group = "<!-- 2 -->Performances" },
  { message = "^revert", group = "<!-- 3 -->Retours en arrière" },
  { message = ".*", skip = true },
]
