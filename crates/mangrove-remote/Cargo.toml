[package]
name = "mangrove-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
dirs = "6"
getrandom = "0.3"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots"] }
secrecy = "0.10.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.48", features = ["rt", "sync", "time", "net", "macros", "io-util"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mangrove-core = { path = "../mangrove-core" }
