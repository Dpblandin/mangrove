[package]
name = "mangrove-update"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
minisign-verify = "0.3"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
