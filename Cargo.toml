[workspace]
members = ["crates/mangrove-core", "crates/mangrove-remote"]
exclude = ["src-gpui"]
default-members = ["crates/mangrove-core", "crates/mangrove-remote"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "FSL-1.1-MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
